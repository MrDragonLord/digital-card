services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: digital_card
      POSTGRES_PASSWORD: digital_card
      POSTGRES_DB: digital_card
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digital_card -d digital_card"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://digital_card:digital_card@db:5432/digital_card
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
